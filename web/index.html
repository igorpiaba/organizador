<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Organizador">
  <meta name="theme-color" content="#0a0d0b">
  <title>Organizador</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icone-192.png">
  <link rel="icon" href="icone-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="estilo.css">
  <script>
    try {
      var t = localStorage.getItem('organizador:tema');
      if (t === 'claro') document.documentElement.dataset.theme = 'light';
      if (t === 'escuro') document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"><p class="vazio">Carregando…</p></div>
  <script type="module" src="app.js"></script>
</body>
</html>
